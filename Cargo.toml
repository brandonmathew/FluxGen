[workspace]
resolver = "2"
members = [
    "crates/fluxgen-core",
    "crates/fluxgen-models",
    "crates/fluxgen-engine",
    "crates/fluxgen-store",
]
# The Tauri application is a separate workspace: it requires platform
# GUI libraries (WebView2 on Windows, WebKitGTK on Linux) that the
# library crates do not depend on.
exclude = ["apps/fluxgen-app"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.77"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
