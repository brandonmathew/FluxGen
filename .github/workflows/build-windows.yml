name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/fluxgen-app
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli
      - name: Build application and NSIS bundle
        working-directory: apps/fluxgen-app
        run: cargo tauri build
      - name: Collect download files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item apps/fluxgen-app/target/release/fluxgen-app.exe dist/FluxGen.exe
          Copy-Item apps/fluxgen-app/target/release/bundle/nsis/*.exe dist/
          Get-ChildItem dist | Format-Table Name, Length
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluxGen-windows
          path: dist/*
      - name: Attach files to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: dist/*
