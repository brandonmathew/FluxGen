name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/fluxgen-app
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli
      - name: Build application, NSIS bundle, and signed updater artifacts
        working-directory: apps/fluxgen-app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build
      - name: Collect download files and the updater manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist | Out-Null
          # Portable download: the application on its own. The
          # engine and all data folders are created next to it on
          # first run.
          $portable = "dist\FluxGen-portable"
          New-Item -ItemType Directory -Force $portable | Out-Null
          Copy-Item apps/fluxgen-app/target/release/fluxgen-app.exe "$portable\FluxGen.exe"
          Compress-Archive -Path $portable -DestinationPath "dist\FluxGen-portable.zip"
          Remove-Item $portable -Recurse -Force
          # Installer for manual installs, plus the signed updater
          # package the in-app updater downloads.
          $nsis = "apps/fluxgen-app/target/release/bundle/nsis"
          Copy-Item "$nsis/*.exe" dist/
          Copy-Item "$nsis/*.nsis.zip" dist/
          $version = (Get-Content apps/fluxgen-app/tauri.conf.json -Raw | ConvertFrom-Json).version
          $updaterZip = Get-ChildItem dist -Filter "*.nsis.zip" | Select-Object -First 1
          if (-not $updaterZip) { throw "updater package was not produced" }
          $signature = Get-Content "$nsis/$($updaterZip.Name).sig" -Raw
          $manifest = [ordered]@{
            version = $version
            notes = "See the release page for changes."
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature.Trim()
                url = "https://github.com/brandonmathew/FluxGen/releases/download/v$version/$($updaterZip.Name)"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content "dist/latest.json" -Encoding utf8
          Get-ChildItem dist | Format-Table Name, Length
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluxGen-windows
          path: dist/*
      - name: Attach files to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: dist/*
