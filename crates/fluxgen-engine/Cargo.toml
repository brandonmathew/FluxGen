[package]
name = "fluxgen-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "stable-diffusion.cpp server process supervision for FluxGen: launch, health check, output capture, exit detection, shutdown."

[dependencies]
fluxgen-core = { path = "../fluxgen-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
base64 = "0.22"
tokio = { version = "1", features = ["rt", "process", "io-util", "time", "sync", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
